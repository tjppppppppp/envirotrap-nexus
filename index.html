input:focus,select:focus,textarea:focus{border-color:#3b6fae;box-shadow:0 0 0 3px rgba(59,111,174,.1)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:#1e3a5f;color:white}.btn-primary:hover{background:#2d5a8e}
.btn-secondary{background:white;color:#1e3a5f;border:1px solid #abc1df}.btn-secondary:hover{background:#eef2f8}

.btn-amber{background:#e9a825;color:white}.btn-amber:hover{background:#c98f1a}
.btn-danger{background:#dc2626;color:white}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{background:#f8f5ee;color:#1e3a5f;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;text-align:left;border-bottom:1px solid #e4d5b5}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f0e8d5;color:#374151}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdfcf8}
.progress-bar{background:#e4d5b5;border-radius:9999px;overflow:hidden}
.progress-fill{height:100%;border-radius:9999px;transition:width .5s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
